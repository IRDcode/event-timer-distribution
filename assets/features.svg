<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<rect width="1280" height="640" fill="#0B0B0C"/>
<g>
<rect x="28" y="28" width="392" height="280" rx="12" fill="#101012" stroke="#262626" stroke-width="1.5"/>
<g transform="translate(320,54)"><rect x="10" y="14" width="44" height="36" rx="5" fill="none" stroke="#F5F4F2" stroke-width="3.5"/>
<line x1="10" y1="26" x2="54" y2="26" stroke="#F5F4F2" stroke-width="3.5"/>
<circle cx="18" cy="20" r="2.4" fill="#F5F4F2"/><circle cx="27" cy="20" r="2.4" fill="#F5F4F2"/></g>
<g font-family="Vazirmatn, Tahoma, Arial, sans-serif" text-anchor="end">
<text x="388" y="176" font-size="27" font-weight="700" fill="#F5F4F2">اجرای پنجره‌ای</text>
<text x="388" y="220" font-size="20" fill="#8A8A8A">میزکار مثل یک پنجره‌ی عادی باز می‌شود؛</text>
<text x="388" y="252" font-size="20" fill="#8A8A8A">قابل تغییر اندازه و مینیمایز است.</text>
</g></g><g>
<rect x="444" y="28" width="392" height="280" rx="12" fill="#101012" stroke="#262626" stroke-width="1.5"/>
<g transform="translate(736,54)"><g fill="none" stroke="#F5F4F2" stroke-width="3.5" stroke-linecap="round">
<path d="M10 24 V14 Q10 10 14 10 H24"/><path d="M40 10 H50 Q54 10 54 14 V24"/>
<path d="M54 40 V50 Q54 54 50 54 H40"/><path d="M24 54 H14 Q10 54 10 50 V40"/></g></g>
<g font-family="Vazirmatn, Tahoma, Arial, sans-serif" text-anchor="end">
<text x="804" y="176" font-size="27" font-weight="700" fill="#F5F4F2">تمام‌صفحه فقط برای صحنه</text>
<text x="804" y="220" font-size="20" fill="#8A8A8A">با «شروع نمایش» پرده قفل و تمام‌صفحه می‌شود؛</text>
<text x="804" y="252" font-size="20" fill="#8A8A8A">با خروج از صحنه به پنجره برمی‌گردد.</text>
</g></g><g>
<rect x="860" y="28" width="392" height="280" rx="12" fill="#101012" stroke="#262626" stroke-width="1.5"/>
<g transform="translate(1152,54)"><g fill="none" stroke="#F5F4F2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M52 22 A19 19 0 1 1 46 10"/><polyline points="46,3 46,12 55,12"/></g></g>
<g font-family="Vazirmatn, Tahoma, Arial, sans-serif" text-anchor="end">
<text x="1220" y="176" font-size="27" font-weight="700" fill="#F5F4F2">به‌روزرسانی ساده</text>
<text x="1220" y="220" font-size="20" fill="#8A8A8A">نصب نسخه‌ی تازه روی نسخه‌ی قبلی؛</text>
<text x="1220" y="252" font-size="20" fill="#8A8A8A">تنظیمات و رویدادها حفظ می‌شوند.</text>
</g></g><g>
<rect x="28" y="332" width="392" height="280" rx="12" fill="#101012" stroke="#262626" stroke-width="1.5"/>
<g transform="translate(320,358)"><g fill="none" stroke="#F5F4F2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M32 8 L50 15 V29 C50 41 41 49 32 53 C23 49 14 41 14 29 V15 Z"/>
<polyline points="24,29 30,35 41,23"/></g></g>
<g font-family="Vazirmatn, Tahoma, Arial, sans-serif" text-anchor="end">
<text x="388" y="480" font-size="27" font-weight="700" fill="#F5F4F2">سخت‌سازی کیوسک</text>
<text x="388" y="524" font-size="20" fill="#8A8A8A">قفل تک‌نمونه، حذف منو، جلوگیری از خواب نمایش</text>
<text x="388" y="556" font-size="20" fill="#8A8A8A">و بازیابی خودکار پس از کرش.</text>
</g></g><g>
<rect x="444" y="332" width="392" height="280" rx="12" fill="#101012" stroke="#262626" stroke-width="1.5"/>
<g transform="translate(736,358)"><circle cx="32" cy="32" r="22" fill="none" stroke="#F5F4F2" stroke-width="3.5"/>
<text x="32" y="42" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="30" font-weight="700" fill="#F5F4F2">؟</text></g>
<g font-family="Vazirmatn, Tahoma, Arial, sans-serif" text-anchor="end">
<text x="804" y="480" font-size="27" font-weight="700" fill="#F5F4F2">راهنما و تور آموزشی</text>
<text x="804" y="524" font-size="20" fill="#8A8A8A">راهنمای داخلی با کلید F1</text>
<text x="804" y="556" font-size="20" fill="#8A8A8A">و تور گام‌به‌گام فارسی.</text>
</g></g><g>
<rect x="860" y="332" width="392" height="280" rx="12" fill="#101012" stroke="#262626" stroke-width="1.5"/>
<g transform="translate(1152,358)"><g fill="none" stroke="#F5F4F2" stroke-width="3.5" stroke-linejoin="round">
<rect x="12" y="10" width="40" height="30" rx="7"/><polygon points="22,40 22,52 34,40"/></g>
<text x="32" y="34" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#F5F4F2">!</text></g>
<g font-family="Vazirmatn, Tahoma, Arial, sans-serif" text-anchor="end">
<text x="1220" y="480" font-size="27" font-weight="700" fill="#F5F4F2">گزارش مشکل با یک کلیک</text>
<text x="1220" y="524" font-size="20" fill="#8A8A8A">هر خطا همان‌جا و با یک کلیک</text>
<text x="1220" y="556" font-size="20" fill="#8A8A8A">گزارش می‌شود.</text>
</g></g>
</svg>